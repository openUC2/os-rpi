---
name: build-os-trixie
on:
  push:
    branches:
      - main
      - edge
    tags:
      - 'v*'
    paths:
      - '**'
      - '!README.md'
  pull_request:
    paths:
      - '**'
      - '!README.md'
  # merge_group:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Git ref (optional)'
        required: false

jobs:
  build:
    name: build
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-os.yml
    secrets: inherit
    with:
      name: os-rpi
      build_variant: ''
      base_release_name: trixie
      base_image_variant: lite
      base_release_date: 2025-11-24
      base_file_release_date: 2025-11-24
      arch: arm64

  upload:
    name: upload-image (Google Drive)
    runs-on: ubuntu-latest
    needs:
      - build
    # TODO: uncomment before merging this PR:
    # if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download built OS image
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}.img.xz
          github-token: ${{ github.token }}

      - name: Upload image to Google Drive
        uses: adityak74/google-drive-upload-git-action@v0.3
        with:
          filename: ${{ needs.build.outputs.image_name }}.img.xz
          folderId: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
          credentials: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS }}
          overwrite: true
