---
name: release channel (stable)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  ff-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - run: |
          git checkout stable
          git merge --ff-only ${{ github.ref_name }}

      - uses: ad-m/github-push-action@v1.3.0
        with:
          branch: stable
