name: hardware-test

# Tests on the real microscope: swaps an ImSwitch image or this repository's pallet in,
# runs the hardware tests which ship inside the ImSwitch image,
# and always restores the machine afterwards.
# See .github/hil/README.md.
on:
  workflow_dispatch:
    inputs:
      image:
        description: >
          Test only this ImSwitch image, on the pallet the machine runs: a tag (e.g. sha-7d3adda)
          or a full image reference. Empty tests the whole pallet of the commit this run is on.
        required: false
        default: ""
      tests:
        description: >
          Space-separated tests (e.g. "board_link firmware_server"). Empty runs every test, which
          moves the stage and switches light.
        required: false
        default: ""
      sync_firmware:
        description: Flash every board to the firmware server's version before the tests.
        type: boolean
        default: false
  # Adding the "hardware-test" label to a PR tests the PR's pallet once.
  # The label is removed afterwards; add it again to test again.
  pull_request:
    types: [labeled]

# There is only one microscope, so only one run at a time:
concurrency:
  group: hardware-test-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write # needed to remove the label

env:
  CONTAINER: imswitch-server-1
  CONTAINER_REPORT: /tmp/hil-report-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  hardware-test:
    # PRs from forks are not tested: this job runs code from the PR on our own machine.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'hardware-test' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, uc2-rig]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # For a PR, the PR's own commit instead of GitHub's merge commit:
          # Forklift can only download commits which are on a branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Determine what to test
        id: target
        env:
          IMAGE: ${{ inputs.image }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$IMAGE" ]; then
            echo "mode=image" >> $GITHUB_OUTPUT
            echo "target=$IMAGE" >> $GITHUB_OUTPUT
          else
            echo "mode=pallet" >> $GITHUB_OUTPUT
            echo "target=github.com/$GITHUB_REPOSITORY@$COMMIT" >> $GITHUB_OUTPUT
          fi

      - name: Restore the machine, if an earlier run could not
        run: .github/hil/restore.sh

      - name: Swap in
        env:
          MODE: ${{ steps.target.outputs.mode }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          echo "Testing the $MODE \`$TARGET\` on \`$(hostname)\`" >> $GITHUB_STEP_SUMMARY
          .github/hil/swap-in.sh "$MODE" "$TARGET"

      # After the swap the local pallet is what is tested, in both modes:
      # for an image it is the pallet the machine runs, with that one image replaced.
      - name: Show the pallet under test
        id: pallet
        run: |
          versions="$(forklift plt show; echo; forklift plt ls-img)"
          echo "$versions"
          { echo '```'; echo "$versions"; echo '```'; } >> $GITHUB_STEP_SUMMARY
          { echo 'versions<<END_OF_VERSIONS'; echo "$versions"; echo END_OF_VERSIONS; } >> $GITHUB_OUTPUT

      # The tests are part of the ImSwitch image, so they always fit the ImSwitch under test.
      # This command line is all this repository knows about them.
      - name: Run the hardware tests
        id: tests
        env:
          TESTS: ${{ inputs.tests }}
          HIL_TARGET: ${{ steps.target.outputs.target }}
          HIL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HIL_PALLET: ${{ steps.pallet.outputs.versions }}
          SYNC_FIRMWARE: ${{ inputs.sync_firmware && '--sync-firmware' || '' }}
        run: |
          docker exec -e HIL_TARGET -e HIL_RUN_URL -e HIL_PALLET "$CONTAINER" \
            python3 -m imswitch.imcontrol._test.hil "$CONTAINER_REPORT" $TESTS $SYNC_FIRMWARE

      # Not when the tests never started, e.g. because the swap failed: then there is no report.
      - name: Copy the report out of the container
        if: always() && steps.tests.conclusion != 'skipped'
        run: |
          docker cp "$CONTAINER:$CONTAINER_REPORT/." hil-report
          cat hil-report/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload the report
        if: always() && steps.tests.conclusion != 'skipped'
        timeout-minutes: 3
        uses: actions/upload-artifact@v7
        with:
          name: hil-report
          path: hil-report
          if-no-files-found: warn
          retention-days: 30

      - name: Restore the machine
        if: always()
        run: .github/hil/restore.sh

      - name: Remove the label
        if: always() && github.event_name == 'pull_request'
        env:
          TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR/labels/hardware-test"
