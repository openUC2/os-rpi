package:
  description: System service to provision files into the root fs from the boot partition during startup
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: Apache-2.0
  sources:
    - https://github.com/openUC2/rpi-imswitch-os

deployment:
  provides:
    file-exports:
      # `init-root-*.tar.gz` archives:
      - description: Shell script to extract init-root archives in the boot partition
        target: overlays/usr/libexec/boot-init-root-extract-archives
      - description: systemd service to extract init-root archives in the boot partition during boot
        target: overlays/usr/lib/systemd/system/boot-init-root-extract-archives.service
      - description: systemd service enablement for boot-init-root-extract-archives.service
        target: overlays/etc/systemd/system/multi-user.target.wants/boot-init-root-extract-archives.service
      # `/boot/firmware/init-root` directory tree:
      - description:
          systemd service to move the contents of `/boot/firmware/init-root/as-{user}` into the root FS during boot with {user} ownership
        target: overlays/usr/lib/systemd/system/boot-init-root@.service
      - description: systemd service enablement for boot-init-root.service for root ownership
        target: overlays/etc/systemd/system/multi-user.target.wants/boot-init-root@root.service
      - description: systemd service enablement for boot-init-root.service for pi ownership
        target: overlays/etc/systemd/system/multi-user.target.wants/boot-init-root@pi.service
