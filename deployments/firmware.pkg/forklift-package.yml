package:
  description: Server hosting firmware binaries for microcontrollers in attached peripherals
  # Note: this is the maintainer for the Forklift package, not for the firmware!
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  # Note: no license has been listed for the firmware binaries
  # The following license is for Caddy
  license: Apache-2.0
  sources:
    - https://github.com/youseetoo/uc2-esp32

deployment:
  compose-files:
    - deployment.compose.yml

features:
  api:
    description: Provides access to the API
    compose-files:
      - api.compose.yml
    requires:
      networks:
        - description: Overlay network for Caddy to connect to upstream services
          name: caddy-ingress
      services:
        - tags: [caddy-docker-proxy]
          port: 80
          protocol: http
    provides:
      services:
        - description: Firmware binaries
          port: 80
          protocol: http
          paths:
            - /firmware
            - /firmware/*
