services:
  server:
    image: ghcr.io/openuc2/serial-monitor:sha-d879d44@sha256:57d242328907d0fa3df0aa8da5a00f570b323cde2f88074c5370c94874994f25
    privileged: true
    ports:
      - 3010:3010
    volumes:
      - type: bind
        source: /dev
        target: /dev
        bind:
          create_host_path: false
      - type: bind
        source: /sys
        target: /sys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
        bind:
          create_host_path: false
