services:
  server:
    image: ghcr.io/openuc2/serial-monitor:sha-3a976a1@sha256:503c6e0435c236f52052139ba57d4b5701e9df9b47a71cf502a4190e19df3f84
    privileged: true
    ports:
      - 3010:3010
    volumes:
      - type: bind
        source: /dev
        target: /dev
        bind:
          create_host_path: false
      - type: bind
        source: /sys
        target: /sys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
        bind:
          create_host_path: false
