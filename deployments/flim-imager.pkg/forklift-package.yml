package:
  description: FLIM LABS FLIM Imager 2.0 acquisition server for the ZestSC3 TCSPC card
  maintainers:
    - name: Benedict Diederich
      email: benedictdied@gmail.com
  sources:
    - https://github.com/flim-labs/flim-imager-2.0

deployment:
  compose-files:
    - deployment.compose.yml
  provides:
    listeners:
      - description: FLIM Imager REST API and web frontend
        port: 5249
        protocol: tcp
    file-exports:
        # TODO: export instead to overlays/flim-imager/firmware, and mount it to the Docker container
      - description: FLIM firmware image
        source-type: http-archive
        url: https://github.com/flim-labs/flim-firmwares/archive/bc670b5ef3e03f3437d732fb92cc784b566480a0.tar.gz
        source: flim-firmwares-bc670b5ef3e03f3437d732fb92cc784b566480a0/channels_detection.flim
        target: overlays/usr/lib/flim-imager/firmware/channels_detection.flim
      - description: FLIM firmware image
        source-type: http-archive
        url: https://github.com/flim-labs/flim-firmwares/archive/bc670b5ef3e03f3437d732fb92cc784b566480a0.tar.gz
        source: flim-firmwares-bc670b5ef3e03f3437d732fb92cc784b566480a0/frequency_meter.flim
