services:
  server:
    image: docker.io/lucaslorentz/caddy-docker-proxy:2.12.1@sha256:f4ca247e0b79aa308d57fd65a3b3abf9420f34449626bcea629365f34c74b832
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - server-data:/data
      - server-config:/config
    ports:
      - 8000:80
    networks:
      - proxied
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - CADDY_DOCKER_SCAN_STOPPED_CONTAINERS=1
      - CADDY_INGRESS_NETWORKS=caddy-ingress-untrusted
    labels:
      caddy.auto_https: disable_redirects

volumes:
  server-data: null
  server-config: null

networks:
  default:
    name: none
    external: true
  proxied:
    name: caddy-ingress-untrusted
