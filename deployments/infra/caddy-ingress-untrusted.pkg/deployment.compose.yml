services:
  server:
    image: docker.io/lucaslorentz/caddy-docker-proxy:2.13.1@sha256:4c14f2ddb9c259903c464ac0423c936b10757bda7c57f8eb34b93efa903c8b8d
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - server-data:/data
      - server-config:/config
    ports:
      - 8000:80
    networks:
      - proxied
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - CADDY_DOCKER_SCAN_STOPPED_CONTAINERS=1
      - CADDY_INGRESS_NETWORKS=caddy-ingress-untrusted
    labels:
      caddy.auto_https: disable_redirects

volumes:
  server-data: null
  server-config: null

networks:
  default:
    name: none
    external: true
  proxied:
    name: caddy-ingress-untrusted
