features:
  frontend:
    description: Provides access to a browser landing page
    compose-files:
      - frontend.compose.yml
    requires:
      networks:
        - description: Overlay network for Caddy to connect to upstream services
          name: caddy-ingress
      services:
        - tags: [caddy-docker-proxy]
          port: 80
          protocol: http
    provides:
      services:
        - description: Landing page for the machine's network services
          port: 80
          protocol: http
          paths:
            - /
            - /favicon.ico
            - /app/*
            - /static/*
            - /fonts/*
  deploy-rpi:
    description: Integrates with Imswitch OS
    compose-files:
      - deploy-rpi.compose.yml
  dev-mock:
    description: Provides a fake machine name, to enable development & testing outside openUC2 OS
    compose-files:
      - dev-mock.compose.yml
  untrusted:
    description: Provides a browser landing page for untrusted users
    compose-files:
      - deployment-untrusted.compose.yml
    provides:
      file-exports:
        # Common template partials
        - source: shared/_common/templates/home/index.page.tmpl
