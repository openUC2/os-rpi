services:
  internal:
    image: docker.io/lucaslorentz/caddy-docker-proxy:2.12.0@sha256:f3ebe7e762bccf17ce38b88420f80ce63f69dc548eea0cd6e5f29db2ae2ea062
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
      - internal-data:/data
      - internal-config:/config
    ports:
      - name: internal
        target: 80
        host_ip: 127.0.0.1
        published: 8080
    networks:
      - proxied
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - CADDY_DOCKER_SCAN_STOPPED_CONTAINERS=1
      - CADDY_INGRESS_NETWORKS=caddy-ingress
    labels:
      caddy.auto_https: disable_redirects

  external:
    image: docker.io/library/caddy:2.11.2@sha256:1e40b251ca9639ead7b5cd2cedcc8765adfbabb99450fe23f130eefabf50f4bc
    network_mode: host
    volumes:
      - type: bind
        source: /run/caddy-ingress/external
        target: /etc/caddy
      - external-data:/data
      - external-config:/config
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch
    # TODO: use `caddy reload` or `docker kill --signal="SIGUSR1" {ctr name}` to the signal instead
    # of using `--watch`, which is only meant for use in local dev envs!
    depends_on:
      ensure-external-caddyfile:
        condition: service_completed_successfully

  ensure-external-caddyfile:
    # This service ensures that a valid Caddyfile exists as a fallback even if
    # /run/caddy-ingress/external doesn't exist, so that the container can start successfully
    image: docker.io/library/alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
    volumes:
      - /run/caddy-ingress/external:/etc/caddy
      - ./external.Caddyfile-fallback:/run/caddy/Caddyfile-fallback
    command: 'sh -c "cat /etc/caddy/Caddyfile || cp /run/caddy/Caddyfile-fallback /etc/caddy/Caddyfile"'

volumes:
  internal-data: null
  internal-config: null
  external-data: null
  external-config: null

networks:
  proxied:
    name: caddy-ingress
