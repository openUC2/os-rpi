services:
  https:
    image: docker.io/library/caddy:2.10.2
    ports:
      - 443:443/tcp
      - 443:443/udp
    volumes:
      - type: bind
        source: ./https.Caddyfile
        target: /etc/caddy/Caddyfile
      - https-data:/data
      - https-config:/config
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
    env_file:
      - path: ./https.env
        required: true
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  https-data: null
  https-config: null
