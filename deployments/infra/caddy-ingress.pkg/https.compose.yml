services:
  https:
    image: docker.io/library/caddy:2.10.2@sha256:86d2ab93167b0c24f9f86e8a4214dee0ba25f86808002bfd29a78677824a2483
    ports:
      - 443:443/tcp
      - 443:443/udp
    volumes:
      - type: bind
        source: /run/caddy-ingress/https
        target: /etc/caddy
      - https-data:/data
      - https-config:/config
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile --watch

volumes:
  https-data: null
  https-config: null
