# The firewalld config file at /etc/firewalld/firewalld.conf is automatically generated by
# concatenating all firewalld configuration drop-in fragment files from
# /etc/firewalld/firewalld.conf.d, with files concatenated in lexicographical order.
#
# To add a new configuration value, you can deploy a Forklift package which exports a firewalld
# configuration fragment file to a target in
# overlays/etc/firewalld/firewalld.conf.d, or you can manually create a new
# firewalld configuration fragment file in /etc/firewalld/firewalld.d
# (the file will actually be saved in
# /var/lib/overlays/overrides/etc/firewalld/firewalld.d,
# but it will appear as if it's in /etc/firewalld/firewalld.d).
# To override an existing configuration value, you should disable the Forklift package (or the
# feature of the Forklift package) which sets the configuration value via a drop-in file; if that's
# not possible, you can directly edit the firewalld configuration fragment file in
# /etc/firewalld/firewalld.d which sets the value -
# your changes will override any identically-named file provided by Forklift until you delete the
# corresponding file with your changes from
# /var/lib/overlays/overrides/etc/firewalld/firewalld.d and reboot.

