package:
  description: Tailscale agent ambiently provided by the OS
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: BSD-3-Clause
  sources:
    - https://github.com/tailscale/tailscale

host:
  provides:
    filesets:
      - description: Sockets for tailscaled
        paths:
          - /run/tailscale/tailscaled.sock
          - /var/run/tailscale/tailscaled.sock

features:
  tailscale-funnel-compatibility:
    description: >
      Unit override for forklift-apply.service to bring down Tailscale (and thus Tailscale Funnel)
      while forklift-apply.service is running
    provides:
      file-exports:
        - description: Override forklift-apply.service to temporarily bring down Tailscale Funnel
          target: overlays/etc/systemd/system/forklift-apply.service.d/tailscale-funnel-workaround.conf
