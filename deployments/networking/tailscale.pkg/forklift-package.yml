package:
  description: Tailscale agent ambiently provided by the OS
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: BSD-3-Clause
  sources:
    - https://github.com/tailscale/tailscale

host:
  provides:
    filesets:
      - description: Sockets for tailscaled
        paths:
          - /run/tailscale/tailscaled.sock
          - /var/run/tailscale/tailscaled.sock

features:
  motd:
    provides:
      file-exports:
        - description: MOTD message reporting the Tailscale DNS name, if available
          target: overlays/etc/update-motd.d/99-tailscale
