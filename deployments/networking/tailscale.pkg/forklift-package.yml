package:
  description: Tailscale agent ambiently provided by the OS
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: BSD-3-Clause
  sources:
    - https://github.com/tailscale/tailscale

host:
  provides:
    filesets:
      - description: Sockets for tailscaled
        paths:
          - /run/tailscale/tailscaled.sock
          - /var/run/tailscale/tailscaled.sock

features:
  motd:
    provides:
      file-exports:
        - description: MOTD message reporting the Tailscale DNS name, if available
          target: overlays/etc/update-motd.d/50-tailscale
  firewall-as-direct:
    description:
      Firewall configuration to attach the tailscale0 network interface to the nm-shared zone for direct connections, instead of the global default zone (e.g. public)
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the nm-shared zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/nm-shared
    provides:
      file-exports:
        - description: Drop-in XML fragment for firewalld's tailscale0 interface attachment
          target: overlays/etc/firewalld/zones.d/nm-shared/20-interface-tailscale0.xml
  firewall-as-public:
    description:
      Firewall configuration to attach the tailscale0 network interface to the public zone, instead of the global default zone
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the public zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/public
    provides:
      file-exports:
        - description: Drop-in XML fragment for firewalld's tailscale0 interface attachment
          target: overlays/etc/firewalld/zones.d/public/20-interface-tailscale0.xml
