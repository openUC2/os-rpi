services:
  reverse-proxy-config:
    image: docker.io/library/alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    command: sh -c 'sleep 60'
    networks:
      - caddy-ingress
    labels:
      caddy: http://
      # Apple:
      caddy.redir_0: /hotspot-detect.html /
      # Google:
      caddy.redir_1: /generate_204 /
      # Linux:
      caddy.redir_2: /check_network_status.txt / # NetworkManager (GNOME)
      # Windows:
      caddy.redir_3: /redirect /
      caddy.redir_4: /connecttest.txt / # Windows 10 or later
      caddy.redir_5: /ncsi.txt / # Windows 8.1 or earlier

networks:
  default:
    name: none
    external: true
  caddy-ingress:
    external: true
