features:
  direct-ip-addresses:
    description: IP addresses for direct connections
    provides:
      file-exports:
        - description: Static IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/eth0-static/62-ipv4-address.nmconnection
        - description: Static IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/eth1-static/62-ipv4-address.nmconnection
        - description: Static IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/usb0-static/62-ipv4-address.nmconnection
        - description: Static IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/usb1-static/62-ipv4-address.nmconnection
  link-local-ip-addresses:
    description: Link-local IP addresses for direct connections
    provides:
      file-exports:
        - description: Link-local IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/eth0-default/63-ipv4-link-local.nmconnection
        - description: Link-local IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/eth0-static/63-ipv4-link-local.nmconnection
        - description: Link-local IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/eth1-default/63-ipv4-link-local.nmconnection
        - description: Link-local IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/eth1-static/63-ipv4-link-local.nmconnection
        - description: Link-local IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/usb0-default/63-ipv4-link-local.nmconnection
        - description: Link-local IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/usb0-static/63-ipv4-link-local.nmconnection
        - description: Link-local IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/usb1-default/63-ipv4-link-local.nmconnection
        - description: Link-local IPv4 address settings
          target: overlays/etc/NetworkManager/system-connections.d/usb1-static/63-ipv4-link-local.nmconnection
  firewall-allow-direct:
    description:
      Firewall configuration to allow ICMP, DHCP, and DNS traffic from directly-connected devices
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the nm-shared zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/nm-shared
    provides:
      file-exports:
        - description: Drop-in XML fragment for firewalld's ICMP protocol
          target: overlays/etc/firewalld/zones.d/nm-shared/30-protocol-icmp.xml
        - description: Drop-in XML fragment for firewalld's DHCP services
          target: overlays/etc/firewalld/zones.d/nm-shared/40-service-dhcp.xml
        - description: Drop-in XML fragment for firewalld's DNS service
          target: overlays/etc/firewalld/zones.d/nm-shared/40-service-dns.xml
  firewall-allow-public:
    description:
      Firewall configuration to allow public ICMP, DHCP, and DNS traffic
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the public zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/public
    provides:
      file-exports:
        - description: Drop-in XML fragment for firewalld's ICMP protocol
          target: overlays/etc/firewalld/zones.d/public/30-protocol-icmp.xml
        - description: Drop-in XML fragment for firewalld's DHCP services
          target: overlays/etc/firewalld/zones.d/public/40-service-dhcp.xml
        - description: Drop-in XML fragment for firewalld's DNS service
          target: overlays/etc/firewalld/zones.d/public/40-service-dns.xml
  manage-usb-gadget:
    description: udev rule to allow NetworkManager to manage the USB gadget port
    requires:
      services:
        - description: systemd service for reloading udev rules
          protocol: systemd
          paths:
            - udev-readd.service
    provides:
      file-exports:
        - description: Drop-in udev rule for enabling NetworkManager on USB gadget devices
          target: overlays/etc/udev/rules.d/99-nm-usb-gadget.rules
  eth0-default-firewall-direct:
    description: Bind eth0 in DHCP client mode to the "nm-shared" firewall zone instead of the "public" zone
    provides:
      file-exports:
        - description: Drop-in NetworkManager connection fragment with firewall zone assignment
          source: overlays/etc/NetworkManager/system-connections.d/eth0-default/22-connection-firewall@nm-shared.nmconnection
          target: overlays/etc/NetworkManager/system-connections.d/eth0-default/22-connection-firewall.nmconnection
  eth0-default-firewall-block:
    description: Bind eth0 in DHCP client mode to the "block" firewall zone instead of the "public" zone
    provides:
      file-exports:
        - description: Drop-in NetworkManager connection fragment with firewall zone assignment
          source: overlays/etc/NetworkManager/system-connections.d/eth0-default/22-connection-firewall@block.nmconnection
          target: overlays/etc/NetworkManager/system-connections.d/eth0-default/22-connection-firewall.nmconnection
  eth0-static-firewall-public:
    description: Bind eth0 in DHCP server mode to the "public" firewall zone instead of the "nm-shared" zone
    provides:
      file-exports:
        - description: Drop-in NetworkManager connection fragment with firewall zone assignment
          source: overlays/etc/NetworkManager/system-connections.d/eth0-static/22-connection-firewall@public.nmconnection
          target: overlays/etc/NetworkManager/system-connections.d/eth0-static/22-connection-firewall.nmconnection
  eth0-static-firewall-block:
