services:
  server:
    networks:
      - caddy-ingress
    labels:
      caddy: http://
      caddy.redir: /opentrons /opentrons/
      caddy.handle_path: /opentrons/*
      caddy.handle_path.reverse_proxy: "{{upstreams 8080}}"

networks:
  default:
    name: none
    external: true
  caddy-ingress:
    external: true
