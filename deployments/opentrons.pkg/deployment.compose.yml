services:
  server:
    # Built by https://github.com/stainSTORM/OT2windy_service (.github/workflows/docker.yml) on every push.
    image: ghcr.io/stainstorm/ot2windy_service:sha-d177a58
    # Host networking, so that the robot is reached the way a shell on the Pi reaches it. A robot
    # cabled to a direct-connect port (eth0, eth1, usb0, usb1: 192.168.5-8.x) is behind a
    # NetworkManager "shared" connection, whose nftables rules reject new connections forwarded
    # from any other interface, Docker bridges included ("Connection refused" in the container).
    network_mode: host
    volumes:
      # config.yaml, its data and the stored Arkitekt login (.state/); edited from the
      # binding page at /opentrons/ or directly on the Pi
      - /home/pi/arkitekt/opentrons:/config
      # a stable Arkitekt device id across container re-creation
      - /etc/machine-id:/etc/machine-id:ro
    environment:
      - OT2_CONFIG=/config/config.yaml
      - PORT=8092  # the binding page; Caddy proxies /opentrons/ to it (8080 is Caddy's)
    depends_on:
      volume-setup:
        condition: service_completed_successfully
    restart: always

  volume-setup:
    # Docker creates a missing bind-mount path owned by root; the app runs as uid 1000 (pi).
    image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    network_mode: none
    volumes:
      - /home/pi/arkitekt/opentrons:/home/pi/arkitekt/opentrons
    command: 'sh -c "chown -R 1000:1000 /home/pi/arkitekt/opentrons"'

networks:
  default:
    name: none
    external: true
