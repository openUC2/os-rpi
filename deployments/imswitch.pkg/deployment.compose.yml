services:
  server:
    image: ghcr.io/openuc2/imswitch:sha-1af4c81@sha256:5551b925fd0a0e7171202718b2cdd0745ffd404eb75ac0d5e3bc50ee887c4be0
    privileged: true
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /home/pi/ImSwitchConfig:/home/pi/ImSwitchConfig
      - /home/pi/Datasets:/home/pi/Datasets
      - /media:/media
      - /run/udev:/run/udev:ro
      # For scanning and accessing USB serial devices:
      - /dev:/dev
      # For libcamera:
      - /dev/dma_heap:/dev/dma_heap
    environment:
      - HEADLESS=1
      - HTTP_PORT=8001
      - CONFIG_PATH=/home/pi/ImSwitchConfig
      - UPDATE_GIT=0
      - UPDATE_CONFIG=0
      - DATA_PATH=/home/pi/Datasets
      - SCAN_EXT_DATA_PATH=1
      - EXT_DATA_PATH=/media
      - SSL=0
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      volume-setup:
        condition: service_completed_successfully
    restart: always

  volume-setup:
    # This service ensures that root isn't the owner of /home/pi/Datasets and
    # /home/pi/ImSwitchConfig, since Docker auto-creates those paths if they didn't exist before
    # for the bind mounts, and Docker creates such directories with root ownership.
    image: docker.io/library/alpine:3.24.0@sha256:a2d49ea686c2adfe3c992e47dc3b5e7fa6e6b5055609400dc2acaeb241c829f4
    volumes:
      - /home/pi/Datasets:/home/pi/Datasets
      - /home/pi/ImSwitchConfig:/home/pi/ImSwitchConfig
    command: 'sh -c "chown -R 1000:1000 /home/pi/Datasets /home/pi/ImSwitchConfig"'
