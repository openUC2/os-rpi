package:
  description: Microscope control server
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
    - name: Benedict Diederich
      email: benedictdied@gmail.com
  license: GPL-3.0-only
  sources:
    - https://github.com/ImSwitch/ImSwitch

deployment:
  compose-files:
    - deployment.compose.yml
  provides:
    listeners:
      - description: "FIXME: Unknown functionality for ESP32 OTA firmware updates"
        port: 3333
        protocol: tcp
      - description: "FIXME: Unknown functionality for ESP32 OTA firmware updates"
        port: 3232
        protocol: tcp

features:
  frontend:
    description: Provides access to the microscope control server
    compose-files:
      - frontend.compose.yml
    requires:
      networks:
        - description: Overlay network for Caddy to connect to upstream services
          name: caddy-ingress
      services:
        - tags: [caddy-docker-proxy]
          port: 80
          protocol: http
    provides:
      services:
        - description: ImSwitch graphical user interface and API
          port: 80
          protocol: http
          paths:
            - /imswitch
            - /imswitch/*
        - description: Jupyter Lab server
          port: 80
          protocol: http
          paths:
            - /jupyter
            - /jupyter/*
  frontend-public:
    description: Provides public access to the microscope control server
    compose-files:
      - frontend-public.compose.yml
    requires:
      networks:
        - description: Overlay network for Caddy to connect to upstream services
          name: caddy-ingress-public
      services:
        - tags: [caddy-docker-proxy]
          port: 8001
          protocol: http
    provides:
      services:
        - description: ImSwitch graphical user interface and API
          port: 8001
          protocol: http
          paths:
            - /imswitch
            - /imswitch/*
        # - description: Jupyter Lab server
        #   port: 8001
        #   protocol: http
        #   paths:
        #     - /jupyter
        #     - /jupyter/*
  firewall-allow-direct:
    description:
      Firewall configuration to allow requests from directly-connected devices
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the nm-shared zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/nm-shared
    provides:
      file-exports:
        - description: Definition for firewalld's imswitch service
          target: overlays/etc/firewalld/services/esp32-ota-firmware.xml
        - description: Drop-in XML fragment for firewalld's imswitch service
          target: overlays/etc/firewalld/zones.d/nm-shared/70-service-esp32-ota-firmware.xml
  firewall-allow-public:
    description:
      Firewall configuration to allow public requests
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the public zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/public
    provides:
      file-exports:
        - description: Definition for firewalld's imswitch service
          target: overlays/etc/firewalld/services/esp32-ota-firmware.xml
        - description: Drop-in XML fragment for firewalld's imswitch service
          target: overlays/etc/firewalld/zones.d/public/70-service-esp32-ota-firmware.xml
  dev-edge:
    description: >-
      Uses the `edge` tag for the ImSwitch docker container image, for faster development
      iteration but no build reproducibility
    compose-files:
      - dev-edge.yml
