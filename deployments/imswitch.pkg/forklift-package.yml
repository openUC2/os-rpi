package:
  description: Microscope control server
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
    - name: Benedict Diederich
      email: benedictdied@gmail.com
  license: GPL-3.0-only
  sources:
    - https://github.com/ImSwitch/ImSwitch

deployment:
  compose-files:
    - deployment.compose.yml
  provides:
    listeners:
      - description: Firmware update authentication service
        port: 3232
        protocol: udp
      - description: Firmware binary transfer service
        port: 3333
        protocol: tcp

features:
  frontend:
    description: Provides access to the microscope control server
    compose-files:
      - frontend.compose.yml
    requires:
      networks:
        - description: Overlay network for Caddy to connect to upstream services
          name: caddy-ingress
      services:
        - tags: [caddy-docker-proxy]
          port: 80
          protocol: http
    provides:
      services:
        - description: ImSwitch graphical user interface and API
          port: 80
          protocol: http
          paths:
            - /imswitch
            - /imswitch/*
        - description: Jupyter Lab server
          port: 80
          protocol: http
          paths:
            - /jupyter
            - /jupyter/*
      file-exports:
        - target: shared/machine-portal-common/templates/home/apps/10-imswitch.item.partial.tmpl
        - target: shared/machine-portal-common/templates/home/apps/10-imswitch.item.simple.partial.tmpl
        - target: shared/machine-portal-common/templates/home/advanced/network-apis/10-imswitch-http-api.item.partial.tmpl
        - target: shared/machine-portal-common/templates/home/advanced/network-apis/20-imswitch-http-api-docs.item.partial.tmpl
        - target: shared/machine-portal-common/templates/home/advanced/network-apis/30-imswitch-http-api-spec.item.partial.tmpl
  frontend-untrusted:
    description: Provides untrusted access to the microscope control server
    compose-files:
      - frontend-untrusted.compose.yml
    requires:
      networks:
        - description: Overlay network for Caddy to connect to upstream services
          name: caddy-ingress-untrusted
      services:
        - tags: [caddy-docker-proxy]
          port: 8000
          protocol: http
    provides:
      services:
        - description: ImSwitch graphical user interface and API
          port: 8000
          protocol: http
          paths:
            - /imswitch
            - /imswitch/*
        # - description: Jupyter Lab server
        #   port: 8000
        #   protocol: http
        #   paths:
        #     - /jupyter
        #     - /jupyter/*
      file-exports:
        - target: shared/machine-portal-common/templates/home/apps/10-imswitch.item.partial.tmpl
        - target: shared/machine-portal-common/templates/home/apps/10-imswitch.item.simple.partial.tmpl
        - target: shared/machine-portal-common/templates/home/advanced/network-apis/10-imswitch-http-api.item.partial.tmpl
        - target: shared/machine-portal-common/templates/home/advanced/network-apis/20-imswitch-http-api-docs.item.partial.tmpl
        - target: shared/machine-portal-common/templates/home/advanced/network-apis/30-imswitch-http-api-spec.item.partial.tmpl
  firewall-allow-direct:
    description:
      Firewall configuration to allow requests from directly-connected devices
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the nm-shared zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/nm-shared
    provides:
      file-exports:
        - target: overlays/etc/firewalld/services/esp32-ota-firmware.xml
        - target: overlays/etc/firewalld/zones.d/nm-shared/70-service-esp32-ota-firmware.xml
        - target: overlays/etc/firewalld/services/imswitch-dev.xml
        - target: overlays/etc/firewalld/zones.d/nm-shared/70-service-imswitch-dev.xml
  firewall-allow-public:
    description:
      Firewall configuration to allow public requests
    requires:
      filesets:
        - description: Drop-in directory for XML fragment files to generate the public zone definition
          tags:
            - drop-in-assembly
          paths:
            - /etc/firewalld/zones.d/public
    provides:
      file-exports:
        - target: overlays/etc/firewalld/services/esp32-ota-firmware.xml
        - target: overlays/etc/firewalld/zones.d/public/70-service-esp32-ota-firmware.xml
        - target: overlays/etc/firewalld/services/imswitch-dev.xml
        - target: overlays/etc/firewalld/zones.d/public/70-service-imswitch-dev.xml
  hikrobot-cameras:
    description: Support for Hikrobot cameras
    provides:
      file-exports:
        - target: overlays/etc/sysctl.d/80-hikrobot-cameras.conf
        - target: overlays/usr/lib/udev/rules.d/65-hikrobot-cameras.rules
  daheng-cameras:
    description: Support for Daheng cameras
    provides:
      file-exports:
        - target: overlays/usr/lib/udev/rules.d/65-daheng-cameras.rules
  tucsen-cameras:
    description: Support for Tucsen cameras
    provides:
      file-exports:
        - target: overlays/etc/tucam/tuusb.conf
        - target: overlays/usr/lib/udev/rules.d/65-tucsen-cameras.rules
        - target: overlays/usr/lib/aarch64-linux-gnu/libTUCam.so
        - target: overlays/usr/lib/aarch64-linux-gnu/libTUCam.so.1
        - target: overlays/usr/lib/aarch64-linux-gnu/libTUCam.so.1.0
        - target: overlays/usr/lib/aarch64-linux-gnu/libTUCam.so.1.0.0
  touptek-cameras:
    description: Support for Touptek cameras
    provides:
      file-exports:
        - target: overlays/usr/lib/udev/rules.d/65-touptek-cameras.rules
        - source-type: http
          url: https://github.com/openUC2/ImSwitchDockerInstall/releases/download/imswitch-master/libtoupcam-arm64-glibc.so
          target: overlays/usr/lib/aarch64-linux-gnu/libtoupcam.so
          permissions: 0755
  alliedvision-cameras:
    description: Support for Allied Vision cameras
    provides:
      file-exports:
        - target: overlays/usr/lib/udev/rules.d/65-alliedvision-cameras.rules
  can-interface:
    description: Provides automatic enablement of the OS interface for an SPI CAN bus transceiver
    compose-files:
      - can-interface.compose.yml
    provides:
      file-exports:
        - target: overlays/etc/systemd/network/80-can0.network
        - description: >-
            systemd-networkd default configuration disablement for Wi-Fi devices in ad-hoc mode,
            which should be managed by NetworkManager instead
          target: overlays/etc/systemd/network/80-wifi-adhoc.network
        - target: overlays/etc/systemd/system/multi-user.target.wants/systemd-networkd.service
  dev-upgrade-os:
    description: Allows ImSwitch to upgrade the OS via Forklift
    compose-files:
      - dev-upgrade-os.yml
    provides:
      file-exports:
        - description: >-
            systemd service run by ImSwitch's (experimental) pallet upgrade button:
            `forklift plt upgrade --force && forklift stage apply`
          target: overlays/usr/lib/systemd/system/imswitch-pallet-upgrade.service
        - description: polkit rule letting pi (the ImSwitch container user) start only that service
          target: overlays/usr/share/polkit-1/rules.d/20-imswitch-pallet-upgrade.rules
