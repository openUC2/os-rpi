services:

  imswitch-noqt:
    image: ghcr.io/openuc2/imswitch-noqt:sha-ac76868@sha256:49c960983b5ba42c752f50b6d167aa799587e80c56162169fb5f1ab43501a416
    privileged: true
    ports:
      - "8001:8001" # frontend, HTTP API, WebSockets API
      - "8888:8888" # Jupyter
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - /home/pi/ImSwitchConfig:/home/pi/ImSwitchConfig
      - /home/pi/Datasets:/home/pi/Datasets
      - /media:/media
      - /run/udev:/run/udev:ro
      - /dev/dma_heap:/dev/dma_heap
    environment:
      - HEADLESS=1
      - HTTP_PORT=8001
      - CONFIG_PATH=/home/pi/ImSwitchConfig
      - UPDATE_GIT=0
      - UPDATE_CONFIG=0
      - DATA_PATH=/home/pi/Datasets
      - SCAN_EXT_DATA_PATH=1
      - EXT_DATA_PATH=/media
      - SSL=0
    restart: always

  volume-setup:
    # This service ensures that root isn't the owner of /home/pi/Datasets and
    # /home/pi/ImSwitchConfig, since Docker auto-creates those paths if they didn't exist before
    # for the bind mounts, and Docker creates such directories with root ownership.
    image: docker.io/library/alpine:3.23.0@sha256:51183f2cfa6320055da30872f211093f9ff1d3cf06f39a0bdb212314c5dc7375
    volumes:
      - /home/pi/Datasets:/home/pi/Datasets
      - /home/pi/ImSwitchConfig:/home/pi/ImSwitchConfig
    command: 'sh -c "chown -R 1000:1000 /home/pi/Datasets /home/pi/ImSwitchConfig; sleep 60"'
