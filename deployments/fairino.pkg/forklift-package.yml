package:
  description: Fairino robot arm as an Arkitekt app, with a page to bind it to an Arkitekt server
  maintainers:
    - name: Benedict Diederich
      email: benedictdied@gmail.com
  license: NOASSERTION
  sources:
    - https://github.com/stainSTORM/fairinogale

deployment:
  compose-files:
    - deployment.compose.yml

features:
  frontend:
    description: Serves the binding page and config editor at /fairino/
    compose-files:
      - frontend.compose.yml
    requires:
      networks:
        - description: Overlay network for Caddy to connect to upstream services
          name: caddy-ingress
      services:
        - tags: [caddy-docker-proxy]
          port: 80
          protocol: http
    provides:
      services:
        - description: Arkitekt binding page and config.yaml editor for the Fairino robot arm
          port: 80
          protocol: http
          paths:
            - /fairino
            - /fairino/*
