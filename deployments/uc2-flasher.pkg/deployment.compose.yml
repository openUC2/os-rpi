services:
  server:
    image: ghcr.io/youseetoo/uc2-flasher:sha-7f2f039@sha256:3ffbcbb05ed3d14e408776655e2fd1ff37b8287cdc6863c4c52931ca6e34b15e
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
    device_cgroup_rules:
      - 'a 188:* rwm' # USB-UART serial devices, e.g. /dev/ttyUSB0 (HAT+)
      - 'a 166:* rwm' # native USB serial devices, e.g. /dev/ttyACM0 (XIAO)
    group_add:
      - dialout
    environment:
      - FIRMWARE_URL=http://host.docker.internal/firmware # firmware.pkg via Caddy
      - IMSWITCH_URL=http://host.docker.internal          # ImSwitch via Caddy: refuse while it runs
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
