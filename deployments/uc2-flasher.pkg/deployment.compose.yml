services:
  server:
    image: ghcr.io/youseetoo/uc2-flasher:sha-5c1c029@sha256:8374b8d8deed527e7b0783b470fce631a617886a64e7e26f5b2569442f200895
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
    device_cgroup_rules:
      - 'a 188:* rwm' # USB-UART serial devices, e.g. /dev/ttyUSB0 (HAT+)
      - 'a 166:* rwm' # native USB serial devices, e.g. /dev/ttyACM0 (XIAO)
    group_add:
      - dialout
    environment:
      - FIRMWARE_URL=http://host.docker.internal/firmware # firmware.pkg via Caddy
      - IMSWITCH_URL=http://host.docker.internal          # ImSwitch via Caddy: refuse while it runs
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
