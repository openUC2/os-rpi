package:
  description: Web flasher for the UC2 boards on this machine's USB ports (HAT + CAN nodes)
  license: GPL-3.0-or-later
  sources:
    - https://github.com/youseetoo/uc2-flasher

deployment:
  compose-files:
    - deployment.compose.yml

features:
  api:
    description: Serves the flasher at /flasher
    compose-files:
      - api.compose.yml
    requires:
      networks:
        - description: Overlay network for Caddy to connect to upstream services
          name: caddy-ingress
      services:
        - tags: [caddy-docker-proxy]
          port: 80
          protocol: http
    provides:
      services:
        - description: UC2 firmware flasher (web UI and API)
          port: 80
          protocol: http
          paths:
            - /flasher
            - /flasher/*
