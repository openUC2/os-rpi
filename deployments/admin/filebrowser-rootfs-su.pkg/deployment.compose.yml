services:
  server:
    image: ghcr.io/gtsteffaniak/filebrowser:2.1.5-beta-slim@sha256:e7b7663e7f6e33aac8627af30e2225445e2c675359787692836b727074d9de9c
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: deployment.filebrowser.yml
        target: /configs/deployment.filebrowser.yml
        bind:
          create_host_path: false
      - server-data:/data
    environment:
      - FILEBROWSER_CONFIG=/configs/deployment.filebrowser.yml
    user: root

volumes:
  server-data: {}
