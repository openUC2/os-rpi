services:
  server:
    image: ghcr.io/gtsteffaniak/filebrowser:2.1.2-beta-slim@sha256:bedc788afa8620ed7e0b863653190d6b0f9e92ecf8dd0280d212020040e97701
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: deployment.filebrowser.yml
        target: /configs/deployment.filebrowser.yml
        bind:
          create_host_path: false
      - server-data:/data
    environment:
      - FILEBROWSER_CONFIG=/configs/deployment.filebrowser.yml
    user: root

volumes:
  server-data: {}
