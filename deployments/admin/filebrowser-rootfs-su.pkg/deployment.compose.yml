services:
  server:
    image: ghcr.io/gtsteffaniak/filebrowser:2.1.6-beta-slim@sha256:d80b8c1759ad0466b0a00438e111ea7c0de9d32dbbc6070a4e8955d5be9e731e
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: deployment.filebrowser.yml
        target: /configs/deployment.filebrowser.yml
        bind:
          create_host_path: false
      - server-data:/data
    environment:
      - FILEBROWSER_CONFIG=/configs/deployment.filebrowser.yml
    user: root

volumes:
  server-data: {}
