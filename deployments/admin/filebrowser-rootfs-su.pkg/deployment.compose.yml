services:
  server:
    image: ghcr.io/gtsteffaniak/filebrowser:2.0.9-beta-slim@sha256:5032b17a7bc0ecd85539350912d97d6b4c43a0aa2e8f0a5d667e63735f4b9f0a
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: deployment.filebrowser.yml
        target: /configs/deployment.filebrowser.yml
        bind:
          create_host_path: false
      - server-data:/data
    environment:
      - FILEBROWSER_CONFIG=/configs/deployment.filebrowser.yml
    user: root

volumes:
  server-data: {}
