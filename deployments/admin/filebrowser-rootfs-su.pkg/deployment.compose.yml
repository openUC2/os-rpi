services:
  server:
    image: docker.io/filebrowser/filebrowser:v2.51.2@sha256:68ac4b9ce0846c03226f169faedb2f704f36c64be2511579d5de590f57692854
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /srv # this prevents filebrowser from making an unnamed volume
        bind:
          create_host_path: false
      - server-data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/root
    user: root
networks:
  default:
    name: none
    external: true
volumes:
  server-data: {}
