services:
  server:
    image: docker.io/filebrowser/filebrowser:v2.61.1@sha256:751252db58b56a23179f8ab19a4c4188792e86806e63737aa25999ef5d2b0c01
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /srv # this prevents filebrowser from making an unnamed volume
        bind:
          create_host_path: false
      - server-data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/root

volumes:
  server-data: {}
