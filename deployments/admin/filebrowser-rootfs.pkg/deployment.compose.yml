services:
  server:
    image: docker.io/filebrowser/filebrowser:v2.63.22@sha256:827fd9c7ecfd60f672c3b057be595283ac4930f64661a686e67d1dda00b6a108
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /srv # this prevents filebrowser from making an unnamed volume
        bind:
          create_host_path: false
      - server-data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/root

volumes:
  server-data: {}
