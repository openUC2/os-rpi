services:
  server:
    image: ghcr.io/gtsteffaniak/filebrowser:2.1.4-beta-slim@sha256:c7323200dc8dd4c1dbe8409bfdd9b21d673d834a284a5903183df9b66740ff34
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: deployment.filebrowser.yml
        target: /configs/deployment.filebrowser.yml
        bind:
          create_host_path: false
      - server-data:/data
    environment:
      - FILEBROWSER_CONFIG=/configs/deployment.filebrowser.yml
    depends_on:
      volume-setup:
        condition: service_completed_successfully

  volume-setup:
    # This service ensures that root isn't the owner of /data, since Docker auto-creates those paths
    # with root ownership.
    image: docker.io/library/alpine:3.24.4@sha256:e2944c2947c8cabdd6b23a2ebcf8094a9f3d53ca9e0340edd065237ab74c18c0
    network_mode: none
    volumes:
      - server-data:/data
    command: 'sh -c "chown -R 1000:1000 /data"'

volumes:
  server-data: {}
