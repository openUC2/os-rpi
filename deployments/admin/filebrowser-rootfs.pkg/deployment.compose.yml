services:
  server:
    image: ghcr.io/gtsteffaniak/filebrowser:2.1.3-beta-slim@sha256:3030787316462ff1e9351dff302b57dbc093da62c446179d34409c17302d2f73
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: deployment.filebrowser.yml
        target: /configs/deployment.filebrowser.yml
        bind:
          create_host_path: false
      - server-data:/data
    environment:
      - FILEBROWSER_CONFIG=/configs/deployment.filebrowser.yml
    depends_on:
      volume-setup:
        condition: service_completed_successfully

  volume-setup:
    # This service ensures that root isn't the owner of /data, since Docker auto-creates those paths
    # with root ownership.
    image: docker.io/library/alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    network_mode: none
    volumes:
      - server-data:/data
    command: 'sh -c "chown -R 1000:1000 /data"'

volumes:
  server-data: {}
