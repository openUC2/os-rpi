services:
  server:
    image: ghcr.io/gtsteffaniak/filebrowser:2.1.1-beta-slim@sha256:0614cb1d912002de83c797011e4dd9f23a56ecb8a6e73d86d7d208a954d60732
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: deployment.filebrowser.yml
        target: /configs/deployment.filebrowser.yml
        bind:
          create_host_path: false
      - server-data:/data
    environment:
      - FILEBROWSER_CONFIG=/configs/deployment.filebrowser.yml
    depends_on:
      volume-setup:
        condition: service_completed_successfully

  volume-setup:
    # This service ensures that root isn't the owner of /data, since Docker auto-creates those paths
    # with root ownership.
    image: docker.io/library/alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    network_mode: none
    volumes:
      - server-data:/data
    command: 'sh -c "chown -R 1000:1000 /data"'

volumes:
  server-data: {}
