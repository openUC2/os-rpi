services:
  server:
    image: docker.io/filebrowser/filebrowser:v2.63.0@sha256:1e67e23118d0b14c91e4cffd56dfeb2851fba1673c8379b200a976c52e322446
    volumes:
      - type: bind
        source: /
        target: /root
        bind:
          create_host_path: false
      - type: bind
        source: /
        target: /srv # this prevents filebrowser from making an unnamed volume
        bind:
          create_host_path: false
      - server-data:/database
    environment:
      - FB_DATABASE=/database/filebrowser.db
      - FB_ROOT=/root

volumes:
  server-data: {}
