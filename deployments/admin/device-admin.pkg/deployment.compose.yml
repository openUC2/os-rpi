services:
  server:
    image: ghcr.io/openuc2/device-admin:0.1.5-alpha.3@sha256:794aa352abc07127ba6faadc6c8ba48dcb953c43589b7e770e51e8ebf4db5dca
    environment:
      - HTTP_BASEPATH=/admin/panel/
      - TEMPLATES_PATH=/web/templates
    volumes:
      - type: bind
        source: ./templates
        target: /web/templates
        read_only: true
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
      - type: bind
        source: /media
        target: /media
networks:
  default:
    name: none
    external: true
