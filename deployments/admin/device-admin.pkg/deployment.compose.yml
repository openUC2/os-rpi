services:
  server:
    image: ghcr.io/openuc2/device-admin:0.1.4@sha256:ef24dcf8fb1afa4591ff5c900da1a939a4d2136a6667acf2d57913b8217b579b
    environment:
      - HTTP_BASEPATH=/admin/panel/
      - TEMPLATES_PATH=/web/templates
    volumes:
      - type: bind
        source: ./templates
        target: /web/templates
        read_only: true
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
networks:
  default:
    name: none
    external: true
