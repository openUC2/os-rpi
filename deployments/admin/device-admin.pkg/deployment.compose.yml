services:
  server:
    image: ghcr.io/openuc2/device-admin:0.1.5-alpha.7@sha256:fafa01f65d567b161e17a55e92ffcc9e9076a007e69a0f92d7c1a8a1116a6de7
    environment:
      - HTTP_BASEPATH=/admin/panel/
      - TEMPLATES_PATH=/web/templates
    volumes:
      - type: bind
        source: ./templates
        target: /web/templates
        read_only: true
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
      - type: bind
        source: /media
        target: /media
networks:
  default:
    name: none
    external: true
