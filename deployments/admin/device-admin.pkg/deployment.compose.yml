services:
  server:
    image: ghcr.io/openuc2/device-admin:0.1.5-alpha.2@sha256:1fe8a111446de39a4af406bd12cf6fbebe1424c50c1b793be2e8477b53f76d98
    environment:
      - HTTP_BASEPATH=/admin/panel/
      - TEMPLATES_PATH=/web/templates
    volumes:
      - type: bind
        source: ./templates
        target: /web/templates
        read_only: true
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
      - type: bind
        source: /media
        target: /media
networks:
  default:
    name: none
    external: true
