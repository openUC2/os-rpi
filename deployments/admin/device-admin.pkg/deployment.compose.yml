services:

  server:
    image: ghcr.io/openuc2/device-admin:0.1.6-alpha.1@sha256:ce1315d2e4cd864c916c487d351aec0571cc4d023e022a17281a3617b6cf83e0
    command: server
    user: 1000:1000
    environment:
      - HTTP_BASEPATH=/admin/panel/
      - TEMPLATES_PATH=/web/templates
      - ACTIONCABLE_HASH_KEYFILE=/secrets/action-cable/hash.key
      - SIDECAR_ADDRESS="tcp:sidecar:2312"
    volumes:
      # - type: bind
      #   source: ./templates
      #   target: /web/templates
      #   read_only: true
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
      - type: bind
        source: /media
        target: /media
      - secrets:/secrets
    restart: always
    depends_on:
      volume-setup:
        condition: service_completed_successfully

  sidecar:
    image: ghcr.io/openuc2/device-admin:0.1.6-alpha.1@sha256:ce1315d2e4cd864c916c487d351aec0571cc4d023e022a17281a3617b6cf83e0
    command: sidecar
    environment:
      - SIDECAR_ADDRESS="tcp:0.0.0.0:2312"
    volumes:
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
    restart: always

  volume-setup:
    # This service ensures that pi is the owner of the secrets volume, since Docker creates it with
    # root ownership.
    image: docker.io/library/alpine:3.23.3@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
    volumes:
      - secrets:/secrets
    command: 'sh -c "chown -R 1000:1000 /secrets"'

networks:
  default:

volumes:
  secrets: null
