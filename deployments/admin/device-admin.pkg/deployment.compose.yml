services:

  server:
    image: ghcr.io/openuc2/device-admin:0.1.5-alpha.8@sha256:cf09a2b450874f8f83398084f3f63d91ed81bc0a141cf2a42d837b2b5373e915
    environment:
      - HTTP_BASEPATH=/admin/panel/
      - TEMPLATES_PATH=/web/templates
      - ACTIONCABLE_HASH_KEYFILE=/secrets/action-cable/hash.key
    volumes:
      - type: bind
        source: ./templates
        target: /web/templates
        read_only: true
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
      - type: bind
        source: /media
        target: /media
      - secrets:/secrets

networks:
  default:
    name: none
    external: true

volumes:
  secrets: null
