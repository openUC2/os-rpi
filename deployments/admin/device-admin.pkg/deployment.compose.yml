services:

  server:
    image: ghcr.io/openuc2/device-admin:0.1.6-alpha.7@sha256:a46ebac5ba979eee88976c89416e83fdca4f146dd58de8f6078f15ad6db5e4e5
    command: server
    user: 1000:1000
    environment:
      - HTTP_BASEPATH=/admin/panel/
      - TEMPLATES_PATH=/web/templates
      - ACTIONCABLE_HASH_KEYFILE=/secrets/action-cable/hash.key
      - SIDECAR_ADDRESS=tcp:sidecar:2312
    networks:
      - sidecar
    volumes:
      # - type: bind
      #   source: ./templates
      #   target: /web/templates
      #   read_only: true
      - type: bind
        source: /run/versioning
        target: /run/versioning
        read_only: true
      - type: bind
        source: /run/machine-name
        target: /run/machine-name
        read_only: true
      - type: bind
        source: /etc/hostname
        target: /etc/hostname
        read_only: true
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
      - type: bind
        source: /media
        target: /media
      - secrets:/secrets
    restart: always
    depends_on:
      volume-setup:
        condition: service_completed_successfully

  sidecar:
    image: ghcr.io/openuc2/device-admin:0.1.6-alpha.7@sha256:a46ebac5ba979eee88976c89416e83fdca4f146dd58de8f6078f15ad6db5e4e5
    command: sidecar
    environment:
      - SIDECAR_ADDRESS=tcp:0.0.0.0:2312
    networks:
      - sidecar
    volumes:
      - type: bind
        source: /etc/NetworkManager/system-connections.d
        target: /etc/NetworkManager/system-connections.d
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
    restart: always

  volume-setup:
    # This service ensures that pi is the owner of the secrets volume, since Docker creates it with
    # root ownership.
    image: docker.io/library/alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    networks:
      - sidecar
    volumes:
      - secrets:/secrets
    command: 'sh -c "chown -R 1000:1000 /secrets"'

networks:
  default:
    name: none
    external: true
  sidecar:
volumes:
  secrets: null
