services:
  server:
    image: ghcr.io/openuc2/device-admin:0.1.5-alpha.2@sha256:c64cb793f6362f34dc3c66fd40a01590a42d9ee96807141489565d675e9a0180
    environment:
      - HTTP_BASEPATH=/admin/panel/
      - TEMPLATES_PATH=/web/templates
    volumes:
      - type: bind
        source: ./templates
        target: /web/templates
        read_only: true
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
      - type: bind
        source: /media
        target: /media
networks:
  default:
    name: none
    external: true
