services:
  server:
    networks:
      - caddy-ingress
    labels:
      caddy: :80
      caddy.redir: /admin/panel /admin/panel/
      caddy.handle: /admin/panel/*
      caddy.handle.reverse_proxy: "{{upstreams 3001}}"

networks:
  default:
    name: none
    external: true
  caddy-ingress:
    external: true
