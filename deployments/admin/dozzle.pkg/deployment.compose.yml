services:
  server:
    image: docker.io/amir20/dozzle:v10.0.0@sha256:844c310771c00254f9928f9dfdf7dc4c8a10acddb8c3b616944b617c890c3325
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
