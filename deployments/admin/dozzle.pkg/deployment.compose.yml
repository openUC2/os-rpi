services:
  server:
    image: docker.io/amir20/dozzle:v10.0.5@sha256:b677dd4b37ca35862593eb99fccb44236e726a8741b15e0bf81213d376bdbb73
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
