services:
  server:
    image: docker.io/amir20/dozzle:v10.0.1@sha256:0b40e62a9469c1c0186394e31ad887fa044d9ff6ac1180b1a03c64cd4dd198cd
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
