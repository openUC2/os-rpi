services:
  server:
    image: docker.io/amir20/dozzle:v10.9.1@sha256:6bfc1e9f58bc58b63e97292fcdb990a792b9e7584919742f0f3ea13881ae60a8
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
