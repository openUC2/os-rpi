services:
  server:
    image: docker.io/amir20/dozzle:v10.3.2@sha256:e21d748133850acf8f9d019a7fd39602402ae4bd1bb8b516eb312fa7203d61bd
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
