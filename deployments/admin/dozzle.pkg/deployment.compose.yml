services:
  server:
    image: docker.io/amir20/dozzle:v10.1.0@sha256:17bae4b6cbe93cdfe83efcc146870c43603ef97f8ad920f9945b212d727cc21c
    volumes:
      - type: bind
        source: /run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    environment:
      - DOZZLE_ENABLE_ACTIONS=true
