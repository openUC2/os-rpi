services:
  server:
    networks:
      - caddy-ingress
    environment:
      - DOZZLE_BASE=/admin/dozzle
    labels:
      caddy: http://, https://
      caddy.redir: /admin/dozzle /admin/dozzle/
      caddy.handle: /admin/dozzle/*
      caddy.handle.reverse_proxy: "{{upstreams 8080}}"

networks:
  default:
    name: none
    external: true
  caddy-ingress:
    external: true
