services:

  server:
    image: ghcr.io/openuc2/machine-admin:0.1.7-alpha.1@sha256:d91cd4a7625090772053d4cdcbce54534a01575fae94d360caa9686c68cd137a
    command: server
    user: 1000:1000
    environment:
      - HTTP_BASEPATH=/admin/panel/
      - TEMPLATES_PATH=/web/templates
      - ACTIONCABLE_HASH_KEYFILE=/secrets/action-cable/hash.key
      - SIDECAR_ADDRESS=tcp:sidecar:2312
    networks:
      - sidecar
    volumes:
      # - type: bind
      #   source: ./templates
      #   target: /web/templates
      #   read_only: true
      - type: bind
        source: /run/versioning
        target: /run/versioning
        read_only: true
      - type: bind
        source: /run/machine-name
        target: /run/machine-name
        read_only: true
      - type: bind
        source: /etc/hostname
        target: /etc/hostname
        read_only: true
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /var/run/tailscale/tailscaled.sock
      - type: bind
        source: /media
        target: /media
      - secrets:/secrets
    restart: always
    depends_on:
      volume-setup:
        condition: service_completed_successfully

  sidecar:
    image: ghcr.io/openuc2/machine-admin:0.1.7-alpha.1@sha256:d91cd4a7625090772053d4cdcbce54534a01575fae94d360caa9686c68cd137a
    command: sidecar
    environment:
      - SIDECAR_ADDRESS=tcp:0.0.0.0:2312
    networks:
      - sidecar
    volumes:
      - type: bind
        source: /etc/NetworkManager/system-connections.d
        target: /etc/NetworkManager/system-connections.d
      - type: bind
        source: /run/dbus/system_bus_socket
        target: /var/run/dbus/system_bus_socket
    restart: always

  volume-setup:
    # This service ensures that pi is the owner of the secrets volume, since Docker creates it with
    # root ownership.
    image: docker.io/library/alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    networks:
      - sidecar
    volumes:
      - secrets:/secrets
    command: 'sh -c "chown -R 1000:1000 /secrets"'

networks:
  default:
    name: none
    external: true
  sidecar:
volumes:
  secrets: null
