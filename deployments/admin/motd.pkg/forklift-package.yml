package:
  description: Login MOTD message
  maintainers:
    - name: Ethan Li
      email: lietk12@gmail.com
  license: BSD-3-Clause
  sources:
    - https://github.com/openUC2/rpi-imswitch-os

deployment:
  provides:
    file-exports:
      - description: Empty main MOTD message
        target: overlays/etc/motd
      - description: No USB gadget MOTD message
        target: overlays/etc/update-motd.d/99-rpi-usb-gadget
      - description: OS-specific MOTD message
        target: overlays/etc/update-motd.d/1-os
